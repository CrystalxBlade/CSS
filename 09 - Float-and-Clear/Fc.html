<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float and Clear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Float and Clear</h1>

    <h2>Float Left</h2>

    <img src="https://via.placeholder.com/150"
         alt="Placeholder"
         class="left">

    <p>
        This paragraph wraps around the image because the image is floated
        to the left.
    </p>

    <hr>

    <h2>Float Right</h2>

    <img src="https://via.placeholder.com/150"
         alt="Placeholder"
         class="right">

    <p>
        This paragraph wraps around the image because the image is floated
        to the right.
    </p>

    <hr>

    <h2>Clear</h2>

    <div class="box left-box">Left</div>

    <div class="box right-box">Right</div>

    <div class="clear-box">
        This element starts below both floated elements.
    </div>

    <hr>

    <h2>Clearfix</h2>

    <div class="container">
        <div class="small-box"></div>
        <div class="small-box"></div>
    </div>

</body>
</html>
