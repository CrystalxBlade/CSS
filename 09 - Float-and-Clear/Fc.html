<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float and Clear</title>
    <link rel="stylesheet" href="Fc.css" />
  </head>

  <body>
    <h1>CSS Float and Clear</h1>

    <h2>Float Left</h2>

    <img
      src="https://images.unsplash.com/photo-1785290301038-208ce8a4f437?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt="Placeholder"
      height="150"
      class="left"
    />

    <p>
      This paragraph wraps around the image because the image is floated to the
      left.
    </p>

    <hr />

    <h2>Float Right</h2>

    <img
      src="https://plus.unsplash.com/premium_photo-1712685912272-96569030d1d7?q=80&w=1475&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt="Placeholder"
      height="150"
      class="right"
    />

    <p>
      This paragraph wraps around the image because the image is floated to the
      right.
    </p>

    <hr />

    <h2>Clear</h2>

    <div class="box left-box">Left</div>

    <div class="box right-box">Right</div>

    <div class="clear-box">
      This element starts below both floated elements.
    </div>

    <hr />

    <h2>Clearfix</h2>

    <div class="container">
      <div class="small-box"></div>
      <div class="small-box"></div>
    </div>
  </body>
</html>
