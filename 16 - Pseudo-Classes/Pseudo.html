<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pseudo Classes</title>
    <link rel="stylesheet" href="Pseudo.css">
</head>
<body>

    <h1>CSS Pseudo Classes</h1>

    <h2>:hover</h2>
    <button class="btn">Hover Me</button>

    <h2>:active</h2>
    <button class="active-btn">Click Me</button>

    <h2>:focus</h2>
    <input type="text" placeholder="Click inside me">

    <h2>:visited & :link</h2>
    <a href="https://google.com" target="_blank">Google</a>

    <h2>:first-child</h2>
    <ul class="list1">
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <h2>:last-child</h2>
    <ul class="list2">
        <li>Red</li>
        <li>Blue</li>
        <li>Green</li>
    </ul>

    <h2>:nth-child()</h2>
    <ul class="list3">
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
        <li>Four</li>
        <li>Five</li>
    </ul>

    <h2>:checked</h2>

    <input type="checkbox" checked>
    Accept Terms

    <br><br>

    <input type="radio" checked>
    Option 1

    <h2>:disabled & :enabled</h2>

    <input type="text" value="Enabled">

    <input type="text" value="Disabled" disabled>

</body>
</html>
