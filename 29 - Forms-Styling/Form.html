<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forms Styling</title>

    <link rel="stylesheet" href="Form.css">

</head>

<body>

    <main class="form-container">

        <form>

            <h1>Registration Form</h1>

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                >

            </div>


            <div class="form-group">

                <label for="country">
                    Country
                </label>

                <select id="country">

                    <option>India</option>
                    <option>USA</option>
                    <option>UK</option>
                    <option>Canada</option>

                </select>

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Write your message..."
                ></textarea>

            </div>


            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="terms"
                >

                <label for="terms">
                    I agree to the terms
                </label>

            </div>


            <button type="submit">
                Create Account
            </button>

        </form>

    </main>

</body>

</html>
