<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Display.css" />
  </head>
  <body>
    <h1>CSS Display Property</h1>

    <h2>Block Elements</h2>

    <div class="block">Block Element 1</div>
    <div class="block">Block Element 2</div>

    <h2>Inline Elements</h2>

    <div class="inline">Inline 1</div>
    <div class="inline">Inline 2</div>

    <h2>Inline-block Elements</h2>

    <div class="inline-block">Item 1</div>
    <div class="inline-block">Item 2</div>

    <h2>Display None</h2>

    <div class="contents">
      <p>Paragraph 1</p>
      <p>Paragraph 2</p>
    </div>

    <h2>Flow Root</h2>
    <div class="flow-root">
      <img
        src="https://i0.wp.com/groundedcuriosity.com/wp-content/uploads/2016/09/bigstock-sunrise-of-earth-blue-shining-85817558.jpg?w=2340&quality=89&ssl=1"
        alt="Placeholder"/ width="400px">
      <p>
        This container establishes a new block formatting context, preventing
        float-related layout issues.
      </p>
    </div>
  </body>
</html>
