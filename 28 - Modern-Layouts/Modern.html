<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Modern CSS Layouts</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            MyWebsite
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>

    </header>


    <main class="layout">

        <aside class="sidebar">

            <h2>Sidebar</h2>

            <a href="#">Dashboard</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>

        </aside>


        <section class="content">

            <h1>Modern Layout</h1>

            <div class="cards">

                <article class="card">
                    <h2>Card 1</h2>
                    <p>
                        Modern responsive card layout.
                    </p>
                </article>

                <article class="card">
                    <h2>Card 2</h2>
                    <p>
                        Built using CSS Grid.
                    </p>
                </article>

                <article class="card">
                    <h2>Card 3</h2>
                    <p>
                        Responsive across screen sizes.
                    </p>
                </article>

            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            © 2026 MyWebsite
        </p>

    </footer>

</body>

</html>
