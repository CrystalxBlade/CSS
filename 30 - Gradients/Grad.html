<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CSS Gradients</title>

    <link rel="stylesheet" href="Grad.css">

</head>

<body>

    <h1>CSS Gradients</h1>

    <section class="gradient-container">

        <div class="box linear">
            Linear Gradient
        </div>

        <div class="box radial">
            Radial Gradient
        </div>

        <div class="box conic">
            Conic Gradient
        </div>

        <div class="box multiple">
            Multiple Gradients
        </div>

    </section>

</body>

</html>
