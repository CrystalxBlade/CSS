<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders</title>
    <link rel="stylesheet" href="Borders.css">
</head>
<body>

    <h1>CSS Borders</h1>

    <h2>Border Width</h2>
    <div class="box border-width">Border Width</div>

    <h2>Border Style</h2>
    <div class="box solid">Solid</div>
    <div class="box dashed">Dashed</div>
    <div class="box dotted">Dotted</div>
    <div class="box double">Double</div>
    <div class="box groove">Groove</div>

    <h2>Border Color</h2>
    <div class="box border-color">Border Color</div>

    <h2>Border Radius</h2>
    <div class="box radius">Rounded Corners</div>

    <h2>Circle</h2>
    <div class="circle"></div>

    <h2>Individual Borders</h2>
    <div class="box individual">
        Different Border Sides
    </div>

    <h2>Outline</h2>
    <div class="box outline">
        Outline Example
    </div>

    <h2>Border Image</h2>
    <div class="box border-image">
        Border Image
    </div>

</body>
</html>
