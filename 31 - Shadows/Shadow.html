<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CSS Shadows</title>

    <link rel="stylesheet" href="Shadow.css">

</head>

<body>

    <h1 class="title">
        CSS Shadows
    </h1>

    <section class="container">

        <div class="box basic">
            Basic Shadow
        </div>

        <div class="box blur">
            Blur Shadow
        </div>

        <div class="box spread">
            Spread Shadow
        </div>

        <div class="box inset">
            Inset Shadow
        </div>

        <div class="box multiple">
            Multiple Shadows
        </div>

    </section>

</body>

</html>
