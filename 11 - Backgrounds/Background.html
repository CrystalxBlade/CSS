<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Backgrounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Backgrounds</h1>

    <h2>Background Color</h2>
    <div class="box bg-color">background-color</div>

    <h2>Background Image</h2>
    <div class="box bg-image"></div>

    <h2>Background Repeat</h2>
    <div class="box bg-repeat"></div>

    <h2>Background Position</h2>
    <div class="box bg-position"></div>

    <h2>Background Size</h2>
    <div class="box bg-size"></div>

    <h2>Background Attachment</h2>
    <div class="attachment">
        Scroll this page to observe the fixed background.
    </div>

    <h2>Multiple Backgrounds</h2>
    <div class="box multiple-bg"></div>

</body>
</html>
