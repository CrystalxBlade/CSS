<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>
    <link rel="stylesheet" href="Transition.css">
</head>
<body>

<h1>CSS Transitions</h1>

<h2>Hover Color</h2>

<button class="btn">
    Hover Me
</button>

<h2>Width Transition</h2>

<div class="box width-box">
    Hover Me
</div>

<h2>Transform Transition</h2>

<div class="box transform-box">
    Scale
</div>

<h2>Opacity Transition</h2>

<div class="box opacity-box">
    Fade
</div>

<h2>Multiple Properties</h2>

<div class="box multi-box">
    Hover Me
</div>

<h2>Timing Functions</h2>

<div class="timing-container">

<div class="timing linear">
    linear
</div>

<div class="timing ease">
    ease
</div>

<div class="timing ease-in">
    ease-in
</div>

<div class="timing ease-out">
    ease-out
</div>

<div class="timing ease-in-out">
    ease-in-out
</div>

</div>

</body>
</html>
